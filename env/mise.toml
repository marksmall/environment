[tools]
# runtimes
node = ["24.12.0", "25.2.1", "24.1.0", "22.17.1", "22.17.0", "22.16.0", "22.6.0", "20.12.2", "20.12.1", "20.11.0", "18.18.0", "8.17.0"]
python = ["3.14.3", "3.14.0t", "3.13.3t", "3.12.3", "3.10.11", "3.8.20"]
java = ["openjdk-25", "openjdk-9", "temurin-8.0.492+9"]
dotnet = ["10.0.301", "9.0.304", "8.0.414", "8.0.413"]

# CLI tooling (native or well-supported)
awscli = ["2.31.37", "2.27.27", "2.27.26"]
azure-cli = ["2.79.0", "2.73.0"]
helm = "4.0.1"
kubectl = ["1.33.1", "1.28.0", "1.22.17"]
kubeseal = "0.24.0"
maven = ["3.9.16", "3.9.1", "3.8.7"]

# azure/kubelogin (AKS auth) — mise default maps "kubelogin" to int128/kubelogin (wrong tool)
"github:azure/kubelogin" = "0.2.8"

# Python tooling
poetry = ["2.1.3", "2.2.0", "2.1.2"]
uv = "0.11.19"

# kubetail via Aqua (shell script, no binary releases)
"aqua:johanhaleby/kubetail" = "1.6.22"

# azcopy via GitHub releases (not in mise registry)
"github:Azure/azure-storage-azcopy" = "10.32.4"

[settings]
# Older CPython releases (pre-3.11 era) were not built with GitHub attestations
python.github_attestations = false
# mise's default registry maps bare "kubelogin" to int128/kubelogin (wrong tool).
# ~/.tool-versions (asdf) has a bare "kubelogin 0.2.8" entry for asdf's own plugin,
# which is fine for asdf but makes mise try to resolve/install the wrong tool
# whenever it processes that file (e.g. `mise exec`, `mise install`). Disabling the
# bare name here stops that, while the aliased "github:azure/kubelogin" entry above
# is a distinct backend identifier and is unaffected — it keeps resolving correctly.
disable_tools = ["kubelogin"]
